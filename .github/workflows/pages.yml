# 从 cf 仓库构建月刊静态网站，并发布到 GitHub Pages。
name: 发布月刊网站

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/pages.yml
    schedule:
        - cron: "*/30 * * * *"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 拉取 cf 主分支
              uses: actions/checkout@v6
              with:
                  repository: NiceBlueChai/cf
                  ref: main
                  path: source
                  persist-credentials: false

            - name: 配置 Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: 测试并构建
              working-directory: source
              run: |
                  npm test
                  npm run build

            - name: 配置 GitHub Pages
              uses: actions/configure-pages@v5

            - name: 上传静态网站
              uses: actions/upload-pages-artifact@v4
              with:
                  path: source/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 发布 GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
